<!doctype html>

<head>

  <title>教父 IP｜品牌预热</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #171311;
      --paper: #eee5d5;
      --muted: #b9aa94;
      --gold: #c5a36b;
      --wine: #6d252d;
      --line: rgba(197, 163, 107, .42);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
    body { color: var(--paper); font-family: "PingFang SC", "Songti SC", "Noto Serif CJK SC", serif; }
    .poster {
      position: relative;
      isolation: isolate;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #171311;
    }
    .art { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; }
    .frame { position: absolute; inset: 24px; border: 1px solid rgba(215, 185, 131, .28); pointer-events: none; }
    .frame::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(215, 185, 131, .09); }
    .topbar {
      position: absolute; top: 58px; left: 82px; right: 82px;
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 22px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .seal { width: 50px; height: 50px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 50%; color: #e5cc9e; font: 17px Georgia, serif; box-shadow: inset 0 0 0 4px rgba(197,163,107,.1); }
    .brand-name { color: #e7ddcb; font: 15px Georgia, "Times New Roman", serif; letter-spacing: 3px; }
    .brand-name small { display: block; margin-top: 6px; color: var(--muted); font: 9px "Helvetica Neue", sans-serif; letter-spacing: 2px; }
    .edition { color: #d6c6ab; font: 10px "Helvetica Neue", sans-serif; letter-spacing: 2px; }
    .copy { position: absolute; top: 239px; left: 121px; width: 785px; }
    .eyebrow { display: flex; align-items: center; gap: 13px; color: #d3b276; font: 11px "Helvetica Neue", sans-serif; letter-spacing: 3px; }
    .eyebrow::before { content: ""; width: 38px; height: 1px; background: var(--gold); }
    h1 { margin: 38px 0 0 -12px; color: #f1e8d8; font-size: 216px; font-weight: 500; line-height: 1; }
    .english { margin-top: 3px; color: #d0ad72; font: 19px Georgia, "Times New Roman", serif; letter-spacing: 7px; }
    .divider { width: 474px; height: 1px; margin: 38px 0 29px; background: linear-gradient(90deg, var(--gold), rgba(197,163,107,.05)); }
    .tagline { color: #f1e8d8; font-size: 39px; line-height: 1.55; }
    .tagline strong { color: #d7b475; font-weight: 500; }
    .support { margin-top: 18px; color: #c0b4a2; font-size: 19px; line-height: 1.9; }
    .support b { color: #e6d9c4; font-weight: 400; }
    .launch { display: flex; align-items: center; gap: 15px; margin-top: 33px; color: #d8c49f; font: 10px "Helvetica Neue", sans-serif; letter-spacing: 2px; }
    .launch i { width: 34px; height: 1px; background: var(--gold); }
    .crest {
      position: absolute; top: 260px; right: 232px; width: 383px; height: 473px;
      display: grid; place-items: center;
    }
    .crest svg { width: 100%; height: 100%; overflow: visible; }
    .network { position: absolute; left: 121px; right: 121px; bottom: 91px; display: flex; align-items: center; gap: 0; border-top: 1px solid var(--line); padding-top: 22px; }
    .network-item { display: flex; align-items: baseline; gap: 12px; padding: 0 27px; border-right: 1px solid rgba(197,163,107,.28); white-space: nowrap; }
    .network-item:first-child { padding-left: 0; }
    .network-item:last-child { border: 0; }
    .network-item small { color: #c6a76f; font: 9px "Helvetica Neue", sans-serif; letter-spacing: 1.5px; }
    .network-item strong { color: #e8ddcb; font-size: 14px; font-weight: 400; }
    .footer { position: absolute; left: 82px; right: 82px; bottom: 47px; display: flex; justify-content: space-between; color: #938879; font: 9px "Helvetica Neue", sans-serif; letter-spacing: 1.8px; }
    .footer b { color: #c6b28e; font-weight: 400; }
    @media print { html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
  </style>
