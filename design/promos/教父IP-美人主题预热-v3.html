    * { box-sizing: border-box; }

    .still-life { position: absolute; top: 150px; right: 78px; width: 830px; height: 770px; display: grid; place-items: center; }
    .still-life svg { width: 100%; height: 100%; overflow: visible; }

    .footer { position: absolute; left: 82px; right: 82px; bottom: 47px; display: flex; justify-content: space-between; color: #938879; font: 9px "Helvetica Neue", sans-serif; letter-spacing: 1.8px; }
